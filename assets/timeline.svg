<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="186" viewBox="0 0 1200 186" role="img" aria-label="Timeline from web design in 2025 to Halograph in November 2026"><rect width="1200" height="186" rx="24" fill="#0a0a0a"/><line x1="90" y1="92" x2="1110" y2="92" stroke="#232323" stroke-width="1.5"/><line x1="90" y1="92" x2="1110" y2="92" stroke="#ededed" stroke-opacity=".55" stroke-width="1.5" stroke-dasharray="1020" stroke-dashoffset="1020"><animate attributeName="stroke-dashoffset" from="1020" to="0" dur="2.4s" fill="freeze"/></line><text x="90" y="58" fill="#5c5c5c" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12.5" text-anchor="middle">before 2026</text><circle cx="90" cy="92" r="4.5" fill="#8a8a8a" stroke="#0a0a0a" stroke-width="3"/><text x="90" y="130" fill="#ededed" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue',Inter,system-ui,sans-serif" font-size="15.5" font-weight="600" text-anchor="middle">Web design</text><text x="90" y="152" fill="#8a8a8a" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue',Inter,system-ui,sans-serif" font-size="13" text-anchor="middle">brands, layouts, copy</text><text x="294" y="58" fill="#5c5c5c" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12.5" text-anchor="middle">May 2026</text><circle cx="294" cy="92" r="4.5" fill="#ededed" stroke="#0a0a0a" stroke-width="3"/><text x="294" y="130" fill="#ededed" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue',Inter,system-ui,sans-serif" font-size="15.5" font-weight="600" text-anchor="middle">First commit</text><text x="294" y="152" fill="#8a8a8a" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue',Inter,system-ui,sans-serif" font-size="13" text-anchor="middle">GitHub account opened</text><text x="498" y="58" fill="#5c5c5c" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12.5" text-anchor="middle">Aug 2026</text><circle cx="498" cy="92" r="4.5" fill="#ededed" stroke="#0a0a0a" stroke-width="3"/><text x="498" y="130" fill="#ededed" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue',Inter,system-ui,sans-serif" font-size="15.5" font-weight="600" text-anchor="middle">First iOS app</text><text x="498" y="152" fill="#8a8a8a" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue',Inter,system-ui,sans-serif" font-size="13" text-anchor="middle">on TestFlight</text><text x="702" y="58" fill="#5c5c5c" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12.5" text-anchor="middle">Sep 2026</text><circle cx="702" cy="92" r="4.5" fill="#ededed" stroke="#0a0a0a" stroke-width="3"/><text x="702" y="130" fill="#ededed" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue',Inter,system-ui,sans-serif" font-size="15.5" font-weight="600" text-anchor="middle">Backend + payments</text><text x="702" y="152" fill="#8a8a8a" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue',Inter,system-ui,sans-serif" font-size="13" text-anchor="middle">running on Cloudflare</text><text x="906" y="58" fill="#5c5c5c" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12.5" text-anchor="middle">Oct 2026</text><circle cx="906" cy="92" r="4.5" fill="#ededed" stroke="#0a0a0a" stroke-width="3"/><text x="906" y="130" fill="#ededed" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue',Inter,system-ui,sans-serif" font-size="15.5" font-weight="600" text-anchor="middle">Agents in parallel</text><text x="906" y="152" fill="#8a8a8a" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue',Inter,system-ui,sans-serif" font-size="13" text-anchor="middle">a team of AI agents</text><text x="1110" y="58" fill="#5c5c5c" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12.5" text-anchor="middle">Nov 2026</text><circle cx="1110" cy="92" r="6" fill="#ededed" stroke="#0a0a0a" stroke-width="3"/><circle cx="1110" cy="92" r="6" fill="none" stroke="#ededed"><animate attributeName="r" values="6;16" dur="1.8s" repeatCount="indefinite"/><animate attributeName="opacity" values=".7;0" dur="1.8s" repeatCount="indefinite"/></circle><text x="1110" y="130" fill="#ededed" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue',Inter,system-ui,sans-serif" font-size="15.5" font-weight="600" text-anchor="middle">Halograph</text><text x="1110" y="152" fill="#8a8a8a" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue',Inter,system-ui,sans-serif" font-size="13" text-anchor="middle">memory for agents</text></svg>