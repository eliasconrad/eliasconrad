acSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" text-anchor="middle">on TestFlight</text><text x="702" y="58" fill="#7d8590" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" text-anchor="middle">Sep 2026</text><circle cx="702" cy="92" r="6" fill="#3fb950" stroke="#0d1117" stroke-width="3"/><text x="702" y="132" fill="#f0f3f6" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="600" text-anchor="middle">Backend + payments</text><text x="702" y="154" fill="#7d8590" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" text-anchor="middle">moved to Cloudflare</text><text x="906" y="58" fill="#7d8590" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" text-anchor="middle">Oct 2026</text><circle cx="906" cy="92" r="6" fill="#3fb950" stroke="#0d1117" stroke-width="3"/><text x="906" y="132" fill="#f0f3f6" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="600" text-anchor="middle">Agents in parallel</text><text x="906" y="154" fill="#7d8590" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" text-anchor="middle">a team of AI agents</text><text x="1110" y="58" fill="#7d8590" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" text-anchor="middle">Nov 2026</text><circle cx="1110" cy="92" r="8" fill="#3fb950" stroke="#0d1117" stroke-width="3"/><circle cx="1110" cy="92" r="8" fill="none" stroke="#3fb950"><animate attributeName="r" values="8;18" dur="1.8s" repeatCount="indefinite"/><animate attributeName="opacity" values=".8;0" dur="1.8s" repeatCount="indefinite"/></circle><text x="1110" y="132" fill="#f0f3f6" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="600" text-anchor="middle">Halograph</text><text x="11