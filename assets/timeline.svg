<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="190" viewBox="0 0 1200 190" role="img" aria-label="Timeline: web design before 2026, first commit May 2026, first iOS app on TestFlight August, backend and Cloudflare September, agents in parallel October, Halograph November">
